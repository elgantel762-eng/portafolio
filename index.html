<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Portafolio — Taller de Herrería</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black:    #0D0D0D;
    --charcoal: #1A1A1A;
    --steel:    #242424;
    --iron:     #2E2E2E;
    --mid:      #3D3D3D;
    --muted:    #6B6B6B;
    --ash:      #999999;
    --light:    #C8C8C8;
    --white:    #F0EDE8;
    --orange:   #D4500A;
    --px: 16px;
  }

  html { -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--black);
    color: var(--white);
    font-size: 14px;
    line-height: 1.65;
    overflow-x: hidden;
  }

  /* ── LOADING ── */
  #loading-screen {
    position: fixed; inset: 0;
    background: var(--black);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1.2rem; z-index: 9999;
    transition: opacity 0.4s ease;
  }
  #loading-screen.hidden { opacity: 0; pointer-events: none; }
  .loader-icon { font-size: 2.5rem; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.25em;
    text-transform: uppercase; color: var(--orange);
  }

  /* ── ERROR ── */
  #error-banner {
    display: none;
    background: #3a0000; border: 1px solid #a00;
    color: #ffaaaa;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    padding: 1rem var(--px); text-align: center; line-height: 1.6;
  }

  /* ── PORTADA ── */
  .cover {
    min-height: 55vh;
    display: flex; flex-direction: column;
    justify-content: flex-end;
    position: relative; overflow: hidden;
    border-bottom: 2px solid var(--orange);
  }
  .cover-grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(var(--iron) 1px, transparent 1px), linear-gradient(90deg, var(--iron) 1px, transparent 1px);
    background-size: 40px 40px; opacity: 0.25;
  }
  .cover-stripe { position: absolute; top: 0; left: 0; width: 5px; height: 100%; background: var(--orange); }
  .cover-bg-letter {
    position: absolute; bottom: -2rem; right: -1rem;
    font-family: 'Bebas Neue', sans-serif;
    font-size: min(55vw, 18rem);
    color: var(--charcoal); line-height: 1;
    user-select: none; pointer-events: none;
  }
  .cover-content { position: relative; padding: 2rem var(--px) 2.5rem calc(var(--px) + 8px); }
  .cover-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px; letter-spacing: 0.25em;
    text-transform: uppercase; color: var(--orange);
    margin-bottom: 1rem;
    display: flex; align-items: center; gap: 10px;
  }
  .cover-eyebrow::before { content: ''; width: 22px; height: 2px; background: var(--orange); }
  .cover-word {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.4rem, 10vw, 4rem);
    color: var(--ash); line-height: 0.9; letter-spacing: 0.04em; display: block;
  }
  .cover-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 14vw, 7rem);
    color: var(--orange); line-height: 0.85;
    letter-spacing: 0.03em; display: block; margin-bottom: 1.8rem;
  }
  .cover-divider { height: 1px; background: var(--iron); margin-bottom: 1.5rem; }
  .cover-info-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem 0.5rem;
  }
  .cover-info-item.full { grid-column: 1 / -1; }
  .info-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8px; letter-spacing: 0.25em;
    text-transform: uppercase; color: var(--orange); margin-bottom: 3px;
  }
  .info-value { font-size: 14px; font-weight: 500; color: var(--light); }

  /* ── SECCIÓN TRABAJOS ── */
  .works-section {
    padding: 20px var(--px) 100px calc(var(--px) + 4px);
    position: relative;
  }
  .works-section::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--orange);
  }
  .works-header {
    display: flex; align-items: flex-end;
    justify-content: space-between;
    gap: 1rem; margin-bottom: 1.5rem;
    border-bottom: 1px solid var(--iron);
    padding-bottom: 1.2rem;
  }
  .works-header-left { display: flex; align-items: flex-end; gap: 1rem; }
  .works-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3.5rem; color: var(--iron); line-height: 1; flex-shrink: 0;
  }
  .works-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px; letter-spacing: 0.25em;
    text-transform: uppercase; color: var(--orange); margin-bottom: 4px;
  }
  .works-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.8rem, 7vw, 3rem);
    letter-spacing: 0.04em; color: var(--white); line-height: 1;
  }

  /* ── BOTÓN CATEGORÍAS ── */
  .cat-open-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: none; border: 1px solid var(--orange);
    color: var(--orange);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 10px 14px;
    cursor: pointer; flex-shrink: 0;
    min-height: 44px;
    transition: background 0.2s, color 0.2s;
    -webkit-appearance: none;
  }
  .cat-open-btn:active { background: var(--orange); color: var(--black); }

  /* ── WORK ITEM ── columna única en móvil */
  .work-item {
    display: flex; flex-direction: column;
    border: 1px solid var(--iron);
    margin-bottom: 2px;
    overflow: hidden;
  }

  /* ── CARRUSEL ── */
  .work-carousel {
    position: relative; background: var(--steel); overflow: hidden;
    min-height: 180px;
  }
  .carousel-track {
    display: flex; transition: transform 0.3s ease;
    touch-action: pan-y; will-change: transform;
  }
  .carousel-slide { flex: 0 0 100%; width: 100%; overflow: hidden; }
  .carousel-slide img {
    width: 100%; height: 260px; object-fit: cover; display: block;
  }
  .carousel-no-img {
    flex: 0 0 100%; width: 100%; height: 180px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px; color: var(--muted);
  }
  .carousel-no-img span { font-size: 2rem; }
  .carousel-no-img p {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
  }
  .carousel-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--white); font-size: 16px;
    width: 40px; height: 40px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 2; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .carousel-btn:active { background: var(--orange); border-color: var(--orange); }
  .carousel-btn.prev { left: 8px; }
  .carousel-btn.next { right: 8px; }
  .carousel-counter {
    position: absolute; bottom: 8px; right: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.12em;
    color: var(--white);
    background: rgba(0,0,0,0.65); padding: 3px 8px;
    pointer-events: none;
  }
  .carousel-dots {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 5px; pointer-events: none;
  }
  .carousel-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(255,255,255,0.35);
    transition: background 0.2s, transform 0.2s;
  }
  .carousel-dot.active { background: var(--orange); transform: scale(1.3); }

  /* ── CARD BODY ── */
  .work-body { padding: 1.2rem var(--px); }
  .work-code {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px; letter-spacing: 0.22em; color: var(--orange); margin-bottom: 4px;
  }
  .work-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem; letter-spacing: 0.04em; color: var(--white); margin-bottom: 0.5rem;
  }
  .work-desc { font-size: 13px; color: var(--ash); font-weight: 300; line-height: 1.65; margin-bottom: 0.8rem; }
  .work-caption {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; color: var(--muted);
    border-left: 2px solid var(--orange); padding-left: 8px; line-height: 1.5;
  }

  /* ── LIGHTBOX ── */
  #lightbox {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.97);
    z-index: 8888; display: none; flex-direction: column;
  }
  #lightbox.open { display: flex; }

  .lb-top {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 0.6rem var(--px);
    display: flex; align-items: center; justify-content: space-between;
    gap: 0.5rem;
    background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
    z-index: 2;
  }
  .lb-back-btn {
    display: flex; align-items: center; gap: 5px;
    background: none; border: none;
    color: var(--white);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 8px 4px; cursor: pointer; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    min-height: 44px;
  }
  .lb-back-btn:active { color: var(--orange); }
  .lb-back-btn svg { flex-shrink: 0; }
  .lb-project-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem; letter-spacing: 0.07em; color: var(--white);
  }
  .lb-counter-top {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.18em; color: var(--ash);
  }
  .lb-close {
    background: none; border: 1px solid var(--iron);
    color: var(--white); font-size: 16px;
    width: 42px; height: 42px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .lb-close:active { background: var(--orange); border-color: var(--orange); }

  .lb-main {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 3.5rem 0 5rem;
    overflow: hidden; position: relative;
    touch-action: pan-y;
  }
  .lb-img-wrap {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 0 4px;
  }
  #lb-img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
    transition: opacity 0.18s ease;
    user-select: none;
    -webkit-user-drag: none;
    transform-origin: center center;
    will-change: transform;
  }
  #lb-img.fading { opacity: 0; }

  /* Flechas de navegación — visibles en móvil y tablet */
  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.18);
    color: var(--white); font-size: 18px;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 3; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.2s, border-color 0.2s;
  }
  .lb-nav:active { background: var(--orange); border-color: var(--orange); }
  .lb-nav:disabled { opacity: 0.15; pointer-events: none; }
  .lb-prev-nav { left: 10px; }
  .lb-next-nav { right: 10px; }

  /* Zonas táctiles laterales — eliminadas, las flechas las reemplazan */
  .lb-tap-prev, .lb-tap-next { display: none; }

  .lb-bottom {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.93) 85%, transparent);
    padding: 1.8rem var(--px) 1.2rem;
    display: flex; flex-direction: column; align-items: center; gap: 0.4rem;
  }
  .lb-slide-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem; letter-spacing: 0.05em;
    color: var(--white); text-align: center; transition: opacity 0.18s;
  }
  .lb-slide-desc {
    font-size: 12px; color: var(--ash); font-weight: 300;
    text-align: center; max-width: 320px; line-height: 1.55; transition: opacity 0.18s;
  }
  .lb-slide-caption {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; color: var(--muted); text-align: center; transition: opacity 0.18s;
  }
  .lb-slide-title.fading, .lb-slide-desc.fading, .lb-slide-caption.fading { opacity: 0; }
  .lb-dots {
    display: flex; gap: 7px; margin-top: 0.4rem;
    flex-wrap: wrap; justify-content: center; max-width: 280px;
  }
  .lb-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--mid); border: 1px solid var(--muted);
    cursor: pointer; transition: background 0.2s, transform 0.2s;
  }
  .lb-dot.active { background: var(--orange); border-color: var(--orange); transform: scale(1.25); }
  .lb-swipe-hint {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px; letter-spacing: 0.18em; color: var(--muted); text-transform: uppercase;
    margin-top: 2px;
  }

  /* ── SHARE ── */
  .lb-share-btn {
    background: none; border: 1px solid var(--iron);
    color: var(--ash); font-size: 16px;
    width: 42px; height: 42px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .lb-share-btn:active { background: var(--iron); color: var(--white); }

  /* Bottom sheet en móvil */
  .lb-share-menu {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--charcoal);
    border-top: 2px solid var(--orange);
    z-index: 9000; display: none; flex-direction: column;
    border-radius: 12px 12px 0 0;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.8);
    padding-bottom: max(env(safe-area-inset-bottom, 0px), 8px);
  }
  .lb-share-menu.open { display: flex; }
  .lb-share-menu-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--orange);
    padding: 14px 16px 8px; border-bottom: 1px solid var(--iron); text-align: center;
  }
  .lb-share-option {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    cursor: pointer; border: none; background: none;
    color: var(--light);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px; text-align: left; width: 100%;
    border-bottom: 1px solid var(--iron);
    min-height: 56px;
    -webkit-tap-highlight-color: transparent;
  }
  .lb-share-option:last-child { border-bottom: none; }
  .lb-share-option:active { background: var(--iron); }
  .lb-share-option .share-icon { font-size: 20px; flex-shrink: 0; }
  .lb-share-option .share-label { display: flex; flex-direction: column; gap: 2px; }
  .lb-share-option .share-label strong { font-weight: 500; font-size: 14px; }
  .lb-share-option .share-label span {
    font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace;
  }
  .lb-share-option--wa { border-top: 1px solid #1a3a1a !important; }
  .lb-share-option--wa:active { background: #0d2b0d !important; color: #4cde80 !important; }
  .lb-share-option--wa svg { color: #25D366; }

  .share-backdrop {
    display: none; position: fixed; inset: 0; z-index: 8999;
  }
  .share-backdrop.open { display: block; }

  /* ── TOAST ── */
  .lb-toast {
    position: fixed; bottom: 5rem; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--orange); color: var(--black);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.12em;
    padding: 10px 18px; opacity: 0; pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 9999; white-space: nowrap;
  }
  .lb-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── OVERLAY CATEGORÍAS ── */
  .cat-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 8000; display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .cat-overlay.open { display: flex; }
  .cat-overlay-box {
    background: var(--black);
    border: 1px solid var(--iron); border-top: 3px solid var(--orange);
    width: 100%; max-height: 90vh;
    display: flex; flex-direction: column;
    border-radius: 12px 12px 0 0;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .cat-overlay-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--iron); flex-shrink: 0;
  }
  .cat-overlay-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem; color: var(--orange); letter-spacing: 0.06em;
  }
  .cat-overlay-close {
    background: none; border: 1px solid var(--iron);
    color: var(--ash); width: 40px; height: 40px;
    cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .cat-overlay-close:active { background: var(--iron); color: var(--white); }
  .cat-overlay-body { overflow-y: auto; padding: 14px; flex: 1; -webkit-overflow-scrolling: touch; }

  .cat-folders { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .cat-folder {
    background: var(--charcoal); border: 1px solid var(--iron);
    cursor: pointer; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .cat-folder:active { border-color: var(--orange); }
  .cat-folder-cover { aspect-ratio: 4/3; overflow: hidden; }
  .cat-folder-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cat-folder-info { padding: 8px 10px; }
  .cat-folder-name { font-size: 12px; font-weight: 500; color: var(--white); }
  .cat-folder-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px; color: var(--muted); margin-top: 2px; letter-spacing: 0.1em;
  }
  .cat-panel { display: none; }
  .cat-panel.open { display: block; }
  .cat-panel-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .cat-panel-back {
    background: none; border: 1px solid var(--iron);
    color: var(--ash);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.1em;
    padding: 8px 14px; cursor: pointer; min-height: 44px;
    -webkit-tap-highlight-color: transparent;
  }
  .cat-panel-back:active { border-color: var(--ash); color: var(--white); }
  .cat-panel-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem; color: var(--orange); letter-spacing: 0.05em;
  }
  .cat-photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--iron); }
  .cat-photo {
    background: var(--black); overflow: hidden;
    cursor: pointer; position: relative; aspect-ratio: 4/3;
    -webkit-tap-highlight-color: transparent;
  }
  .cat-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cat-photo-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, transparent 55%);
    display: flex; flex-direction: column; justify-content: flex-end; padding: 8px;
  }
  .cat-photo-title { font-size: 11px; font-weight: 500; color: var(--white); line-height: 1.3; }
  .cat-photo-proj { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--ash); margin-top: 1px; }

  /* ── BOTÓN WA FLOTANTE ── */
  .wa-fab {
    position: fixed;
    bottom: calc(1.2rem + env(safe-area-inset-bottom, 0px));
    right: 1.2rem;
    z-index: 7000;
    background: #25D366; color: #000;
    width: 58px; height: 58px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 20px rgba(37,211,102,0.4);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .wa-fab:active { transform: scale(0.93); box-shadow: 0 2px 10px rgba(37,211,102,0.3); }
  .wa-fab svg { width: 28px; height: 28px; }

  /* ── FOOTER ── */
  .footer {
    background: var(--orange);
    padding: 1.2rem var(--px) calc(1.2rem + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: flex-start; gap: 0.8rem;
  }
  .footer-brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem; color: var(--black); letter-spacing: 0.06em;
  }
  .footer-tel { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--black); font-weight: 500; }
  .footer-wa-btn {
    display: none;
    align-items: center; gap: 8px;
    background: var(--black); color: #fff;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    padding: 12px 20px; text-decoration: none; min-height: 48px;

  /* ── TABLET (600px+) ── */

    .cat-overlay-box { max-width: 980px; max-height: 88vh; border-radius: 0; }

      position: fixed; top: 56px; right: 12px; bottom: auto; left: auto;

<script>
/* ══════════════════════════════════════════════════════════════════
   CONFIGURACIÓN — pega tu URL CSV aquí
   ══════════════════════════════════════════════════════════════════ */
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT0EsypMcIaENuPPyaYiEEdf9u40np7EU5tpPdKSD86PYMzs4LPxUg9jA5_Asle8vG3XVUsHFW8nhvb/pub?output=csv';

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  return lines.slice(1).map(line => {
    const cols = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += c; }
    }
    cols.push(cur.trim());
    return cols;
  });
}

function escH(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function groupWorks(rows) {
  const map = new Map(); const order = []; let zeroIdx = 0;
  for (const row of rows) {
    const tipo = (row[0] || '').toLowerCase().trim();
    if (tipo !== 'trabajo') continue;
    const rawClave = (row[1] || '').trim();
    if (!rawClave) continue;
    const clave = rawClave === '0' ? `0-${zeroIdx++}` : rawClave;
    const slide = { categoria: (row[2]||'').trim(), titulo: row[3]||'', desc: row[4]||'', pie: row[5]||'', foto: (row[6]||'').trim() };
    if (!map.has(clave)) { map.set(clave, { clave, first: slide, slides: [] }); order.push(clave); }
    if (slide.foto) map.get(clave).slides.push(slide);
  }
  return order.map(k => map.get(k));
}

function renderWork(group, cardNum) {
  const { clave, first, slides } = group;
  const id = `car-${clave.replace(/\s+/g,'-')}`;
  const isZero = group.clave.startsWith('0-');
  const code = isZero ? '// N/A' : `// PROYECTO-${String(cardNum).padStart(2,'0')}`;
  let carouselHTML;
  if (slides.length === 0) {
    carouselHTML = `<div class="work-carousel"><div class="carousel-track"><div class="carousel-no-img"><span>📷</span><p>Sin fotos aún</p></div></div></div>`;
  } else {
    const slidesHTML = slides.map((s, i) => `<div class="carousel-slide" data-idx="${i}"><img src="${escH(s.foto)}" alt="${escH(s.titulo)}" loading="lazy"></div>`).join('');
    const dotsHTML = slides.length > 1
      ? `<div class="carousel-dots">${slides.map((_,i) => `<div class="carousel-dot${i===0?' active':''}"></div>`).join('')}</div>` : '';
    const btns = slides.length > 1 ? `
      <button class="carousel-btn prev" data-id="${id}">&#8592;</button>
      <button class="carousel-btn next" data-id="${id}">&#8594;</button>
      <div class="carousel-counter" id="${id}-counter">1 / ${slides.length}</div>` : '';
    carouselHTML = `
      <div class="work-carousel" id="${id}" data-index="0" data-total="${slides.length}" data-iszero="${isZero?'1':''}">
        <div class="carousel-track" id="${id}-track">${slidesHTML}</div>
        ${btns}${dotsHTML}
      </div>`;
  }
  return `
  <div class="work-item" id="proyecto-${encodeURIComponent(clave)}" data-clave="${escH(clave)}" data-cardnum="${cardNum}">
    ${carouselHTML}
    <div class="work-body">
      <div class="work-code" id="${id}-code">${escH(code)}</div>
      <div class="work-title" id="${id}-title">${escH(slides[0]?.titulo||'')}</div>
      <div class="work-desc" id="${id}-desc">${escH(slides[0]?.desc||first.desc)}</div>
      <div class="work-caption" id="${id}-caption">${escH(slides[0]?.pie||first.pie)}</div>
    </div>
  </div>`;
}

const carouselData = {};

function initCarousels(groups) {
  groups.forEach(g => { carouselData[`car-${g.clave.replace(/\s+/g,'-')}`] = g.slides; });

  // Botones flecha
  document.querySelectorAll('.carousel-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const car = document.getElementById(id);
      const track = document.getElementById(`${id}-track`);
      let idx = parseInt(car.dataset.index);
      const total = parseInt(car.dataset.total);
      idx = btn.classList.contains('prev') ? (idx - 1 + total) % total : (idx + 1) % total;
      moveCarousel(car, track, id, idx, total);
    });
  });

  // Swipe + tap en carruseles
  document.querySelectorAll('.work-carousel').forEach(car => {
    let sx = 0, sy = 0, ok = false, moved = false;
    const track = car.querySelector('.carousel-track');
    const id = car.id;
    const total = parseInt(car.dataset.total) || 1;

    car.addEventListener('touchstart', e => {
      if (e.target.closest('.carousel-btn')) return;
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; ok = true; moved = false;
    }, { passive: true });
    car.addEventListener('touchmove', e => {
      if (!ok) return;
      const dx = Math.abs(e.touches[0].clientX - sx);
      const dy = Math.abs(e.touches[0].clientY - sy);
      if (dy > dx) { ok = false; return; }
      if (dx > 6) moved = true;
    }, { passive: true });
    car.addEventListener('touchend', e => {
      if (!ok) return;
      const dx = e.changedTouches[0].clientX - sx;
      if (!moved) {
        openFromCarousel(car, id);
      } else if (Math.abs(dx) >= 40) {
        let idx = parseInt(car.dataset.index);
        if (dx < 0 && idx < total - 1) idx++;
        else if (dx > 0 && idx > 0) idx--;
        moveCarousel(car, track, id, idx, total);
      }
      ok = false;
    }, { passive: true });

    // Click (desktop) — solo imagen, no botones
    track.addEventListener('click', e => {
      if (e.target.closest('.carousel-btn')) return;
      openFromCarousel(car, id);
    });
  });
}

function openFromCarousel(car, id) {
  const slides = carouselData[id];
  if (!slides || !slides.length) return;
  const idx = parseInt(car.dataset.index) || 0;
  const item = car.closest('[data-cardnum]');
  const cardNum = item ? item.dataset.cardnum : '';
  const isZ = car.dataset.iszero === '1';
  const title = isZ ? '// N/A' : `// PROYECTO-${String(cardNum).padStart(2,'0')}`;
  const clave = car.closest('[data-clave]')?.dataset.clave || id.replace('car-','');
  openLightbox(slides, title, idx, clave);
}

function moveCarousel(car, track, id, idx, total) {
  car.dataset.index = idx;
  track.style.transform = `translateX(-${idx * 100}%)`;
  const counter = document.getElementById(`${id}-counter`);
  if (counter) counter.textContent = `${idx + 1} / ${total}`;
  car.querySelectorAll('.carousel-dot').forEach((d,i) => d.classList.toggle('active', i===idx));
  const slides = carouselData[id];
  if (slides && slides[idx]) {
    const t = document.getElementById(`${id}-title`);
    const d = document.getElementById(`${id}-desc`);
    const c = document.getElementById(`${id}-caption`);
    if (t) t.textContent = slides[idx].titulo || '';
    if (d) d.textContent = slides[idx].desc   || '';
    if (c) c.textContent = slides[idx].pie    || '';
  }
  const codeEl = document.getElementById(`${id}-code`);
  if (codeEl) {
    const item = car.closest('[data-cardnum]');
    const num = item ? item.dataset.cardnum : '';
    codeEl.textContent = car.dataset.iszero==='1' ? '// N/A' : `// PROYECTO-${String(num).padStart(2,'0')}`;
  }
}

/* ── Lightbox ── */
let lbSlides = [], lbCurrent = 0, lbClave = '', lbFromCat = false, lbScrollY = 0, lbCatOverlay = null;

function openLightbox(slides, projectTitle, startIdx, clave, catOverlay) {
  lbSlides = slides; lbCurrent = startIdx; lbClave = clave || '';
  lbFromCat = !clave;
  lbCatOverlay = catOverlay || null;
  lbScrollY = window.scrollY;
  document.getElementById('lb-project-title').textContent = projectTitle;
  buildDots();
  showLbSlide(lbCurrent, false);
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
  if (lbClave) history.replaceState(null,'','#proyecto-'+encodeURIComponent(lbClave));
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  const img = document.getElementById('lb-img');
  img.style.transition = 'none';
  img.style.transform = '';
  history.replaceState(null,'',window.location.pathname+window.location.search);

  if (lbCatOverlay) {
    // Vino de categoría → reabrir el overlay, mantener scroll bloqueado
    document.body.style.overflow = 'hidden';
    lbCatOverlay.classList.add('open');
    lbCatOverlay = null;
  } else {
    // Vino de proyecto → restaurar scroll donde estaba
    document.body.style.overflow = '';
    window.scrollTo({ top: lbScrollY, behavior: 'instant' });
  }
}

function showLbSlide(idx, animate) {
  const slide = lbSlides[idx];
  const img = document.getElementById('lb-img');
  const elT = document.getElementById('lb-slide-title');
  const elD = document.getElementById('lb-slide-desc');
  const elC = document.getElementById('lb-slide-caption');

  // Si viene de categoría, actualizar el título con el proyecto de esta foto
  if (lbFromCat && slide._cardNum !== undefined) {
    const projLabel = slide._clave && slide._clave.startsWith('0-')
      ? '// N/A'
      : `// PROYECTO-${String(slide._cardNum).padStart(2,'0')}`;
    document.getElementById('lb-project-title').textContent = projLabel;
  }

  if (animate) {
    img.classList.add('fading'); elT.classList.add('fading'); elD.classList.add('fading'); elC.classList.add('fading');
    setTimeout(() => {
      img.src = slide.foto; elT.textContent = slide.titulo; elD.textContent = slide.desc; elC.textContent = slide.pie;
      img.classList.remove('fading'); elT.classList.remove('fading'); elD.classList.remove('fading'); elC.classList.remove('fading');
    }, 180);
  } else {
    img.src = slide.foto; elT.textContent = slide.titulo; elD.textContent = slide.desc; elC.textContent = slide.pie;
  }
  document.getElementById('lb-counter-top').textContent = `${idx+1} / ${lbSlides.length}`;
  const p = document.getElementById('lb-prev'); const n = document.getElementById('lb-next');
  if (p) p.disabled = (idx===0); if (n) n.disabled = (idx===lbSlides.length-1);
  document.querySelectorAll('.lb-dot').forEach((d,i) => d.classList.toggle('active', i===idx));
  lbCurrent = idx;
}

function buildDots() {
  const wrap = document.getElementById('lb-dots');
  if (lbSlides.length <= 20) {
    wrap.innerHTML = lbSlides.map((_,i) => `<div class="lb-dot${i===lbCurrent?' active':''}" data-i="${i}"></div>`).join('');
    wrap.querySelectorAll('.lb-dot').forEach(d => d.addEventListener('click', () => showLbSlide(parseInt(d.dataset.i), true)));
  } else { wrap.innerHTML = ''; }
}

function initLightboxSwipe() {
  const main = document.getElementById('lb-main');
  const img  = document.getElementById('lb-img');

  // ── Estado zoom ──
  let scale = 1, originX = 0, originY = 0, panX = 0, panY = 0;
  let lastTap = 0;

  function applyTransform(animate) {
    img.style.transition = animate ? 'transform 0.25s ease' : 'none';
    img.style.transform  = `translate(${panX}px, ${panY}px) scale(${scale})`;
  }
  function resetZoom(animate) {
    scale = 1; panX = 0; panY = 0;
    applyTransform(animate);
  }

  // Clamp pan para que la imagen no salga de vista
  function clampPan() {
    const rect = img.getBoundingClientRect();
    const pw = main.clientWidth;
    const ph = main.clientHeight;
    const overX = Math.max(0, (rect.width  - pw) / 2);
    const overY = Math.max(0, (rect.height - ph) / 2);
    panX = Math.max(-overX, Math.min(overX, panX));
    panY = Math.max(-overY, Math.min(overY, panY));
  }

  // Resetear zoom al cambiar de slide
  const origShowLbSlide = showLbSlide;
  showLbSlide = function(idx, animate) {
    resetZoom(false);
    origShowLbSlide(idx, animate);
  };

  // ── Touch handlers ──
  let touches = [];
  let startDist = 0, startScale = 1;
  let startPanX = 0, startPanY = 0;
  let startMidX = 0, startMidY = 0;
  let swipeOk = false, didPinch = false, didPan = false;
  let touchSX = 0, touchSY = 0;
  let dirLocked = null; // 'h' = horizontal, 'v' = vertical, null = sin decidir

  main.addEventListener('touchstart', e => {
    touches = Array.from(e.touches);
    didPinch = false; didPan = false; dirLocked = null;

    if (touches.length === 1) {
      touchSX = touches[0].clientX;
      touchSY = touches[0].clientY;
      startPanX = panX; startPanY = panY;
      swipeOk = true;

      // Doble tap → zoom 2.5x / reset
      const now = Date.now();
      if (now - lastTap < 300) {
        if (scale > 1) { resetZoom(true); }
        else {
          scale = 2.5;
          const rect = img.getBoundingClientRect();
          originX = touches[0].clientX - rect.left - rect.width  / 2;
          originY = touches[0].clientY - rect.top  - rect.height / 2;
          panX = -originX * (scale - 1) / scale;
          panY = -originY * (scale - 1) / scale;
          clampPan();
          applyTransform(true);
        }
        lastTap = 0; swipeOk = false; return;
      }
      lastTap = now;
    }

    if (touches.length === 2) {
      swipeOk = false; dirLocked = null;
      const dx = touches[1].clientX - touches[0].clientX;
      const dy = touches[1].clientY - touches[0].clientY;
      startDist  = Math.hypot(dx, dy);
      startScale = scale;
      startMidX  = (touches[0].clientX + touches[1].clientX) / 2;
      startMidY  = (touches[0].clientY + touches[1].clientY) / 2;
      startPanX  = panX; startPanY = panY;
    }
  }, { passive: true });

  main.addEventListener('touchmove', e => {
    touches = Array.from(e.touches);

    // ── Pinch zoom (2 dedos) ──
    if (touches.length === 2) {
      e.preventDefault();
      const dx = touches[1].clientX - touches[0].clientX;
      const dy = touches[1].clientY - touches[0].clientY;
      const dist = Math.hypot(dx, dy);
      scale = Math.max(1, Math.min(5, startScale * dist / startDist));
      const midX = (touches[0].clientX + touches[1].clientX) / 2;
      const midY = (touches[0].clientY + touches[1].clientY) / 2;
      panX = startPanX + (midX - startMidX);
      panY = startPanY + (midY - startMidY);
      clampPan();
      applyTransform(false);
      didPinch = true;
      return;
    }

    if (touches.length === 1 && swipeOk) {
      const dx = touches[0].clientX - touchSX;
      const dy = touches[0].clientY - touchSY;

      // ── Pan dentro del zoom ──
      if (scale > 1) {
        e.preventDefault();
        panX = startPanX + dx;
        panY = startPanY + dy;
        clampPan();
        applyTransform(false);
        didPan = true;
        return;
      }

      // ── Sin zoom: decidir dirección en el primer movimiento notable ──
      if (!dirLocked && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
        dirLocked = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
      }

      if (dirLocked === 'h') {
        e.preventDefault(); // bloquear scroll mientras desliza horizontal
      }
      // Si dirLocked === 'v', no hacemos nada → el browser hace scroll normalmente
      if (dirLocked === 'v') {
        swipeOk = false;
      }
    }
  }, { passive: false });

  main.addEventListener('touchend', e => {
    if (didPinch || didPan) { didPinch = false; didPan = false; dirLocked = null; return; }
    if (!swipeOk || dirLocked !== 'h') { swipeOk = false; dirLocked = null; return; }

    const dx = e.changedTouches[0].clientX - touchSX;
    if (Math.abs(dx) > 50 && scale === 1) {
      if (dx < 0 && lbCurrent < lbSlides.length - 1) showLbSlide(lbCurrent + 1, true);
      else if (dx > 0 && lbCurrent > 0)               showLbSlide(lbCurrent - 1, true);
    }
    swipeOk = false; dirLocked = null;
  }, { passive: true });

  // Las flechas (lb-prev / lb-next) se conectan en initLightbox
  // Las zonas táctiles están desactivadas (display:none)
}

function showToast(msg) {
  const t = document.getElementById('lb-toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => showToast('✓ ENLACE COPIADO')).catch(() => fallbackCopy(text));
  } else { fallbackCopy(text); }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea'); ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); showToast('✓ ENLACE COPIADO'); } catch(e) { showToast('⚠ NO SE PUDO COPIAR'); }
  document.body.removeChild(ta);
}
function shareData(data) {
  if (navigator.share) { navigator.share(data).catch(() => copyToClipboard(data.url||data.text||'')); }
  else { copyToClipboard(data.url||data.text||''); }
}

function initLightbox() {
  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lb-back-btn').addEventListener('click', closeLightbox);
  const pB = document.getElementById('lb-prev'); const nB = document.getElementById('lb-next');
  if (pB) pB.addEventListener('click', () => { if (lbCurrent>0) showLbSlide(lbCurrent-1, true); });
  if (nB) nB.addEventListener('click', () => { if (lbCurrent<lbSlides.length-1) showLbSlide(lbCurrent+1, true); });  initLightboxSwipe();

  const shareBtn = document.getElementById('lb-share-btn');
  const shareMenu = document.getElementById('lb-share-menu');
  const backdrop = document.getElementById('share-backdrop');
  function openShare() { shareMenu.classList.add('open'); backdrop.classList.add('open'); }
  function closeShare() { shareMenu.classList.remove('open'); backdrop.classList.remove('open'); }
  shareBtn.addEventListener('click', e => { e.stopPropagation(); openShare(); });
  backdrop.addEventListener('click', closeShare);
  shareMenu.addEventListener('click', e => e.stopPropagation());

  document.getElementById('share-whatsapp').addEventListener('click', () => {
    closeShare();
    const slide = lbSlides[lbCurrent]; if (!slide) return;
    const link = window.location.href.split('#')[0]+'#proyecto-'+encodeURIComponent(lbClave)+'-foto-'+(lbCurrent+1);
    const msg = encodeURIComponent(' *'+slide.titulo+'*'+(slide.desc?'\n'+slide.desc:'')+'\n\n'+link);
    const phone = (window._tallerTelefono||'').replace(/\D/g,'');
    if (!phone) { showToast('⚠ TELÉFONO NO CONFIGURADO'); return; }
    window.open('https://wa.me/'+phone+'?text='+msg, '_blank');
  });
  document.getElementById('share-project').addEventListener('click', () => {
    closeShare();
    const title = document.getElementById('lb-project-title').textContent;
    const link = window.location.href.split('#')[0]+'#proyecto-'+encodeURIComponent(lbClave);
    shareData({ title, text: title, url: link });
  });
  document.getElementById('share-image').addEventListener('click', () => {
    closeShare();
    const slide = lbSlides[lbCurrent]; if (!slide) return;
    const title = slide.titulo || document.getElementById('lb-project-title').textContent;
    const link = window.location.href.split('#')[0]+'#proyecto-'+encodeURIComponent(lbClave)+'-foto-'+(lbCurrent+1);
    shareData({ title, text: title, url: link });
  });
  document.getElementById('lightbox').addEventListener('click', e => { if (e.target.id==='lightbox') closeLightbox(); });
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key==='Escape') closeLightbox();
    if (e.key==='ArrowLeft' && lbCurrent>0) showLbSlide(lbCurrent-1, true);
    if (e.key==='ArrowRight' && lbCurrent<lbSlides.length-1) showLbSlide(lbCurrent+1, true);
  });
}

function showError(msg) { const el = document.getElementById('error-banner'); el.innerHTML = msg; el.style.display = 'block'; hideLoader(); }
function hideLoader() { const l = document.getElementById('loading-screen'); l.classList.add('hidden'); setTimeout(() => l.remove(), 500); }

async function loadData() {
  if (!SHEET_CSV_URL || SHEET_CSV_URL === 'PEGA_AQUI_TU_URL_CSV') {
    showError(`⚠️ <strong>URL de Google Sheets no configurada.</strong>`); return;
  }
  const url = 'https://corsproxy.io/?' + encodeURIComponent(SHEET_CSV_URL + `&_t=${Date.now()}`);
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const rows = parseCSV(await resp.text());
    const info = {};
    for (const row of rows) {
      if ((row[0]||'').toLowerCase().trim()==='info') info[(row[1]||'').trim()] = row[2]||'';
    }
    const nombre = info['nombre_taller'] || '[ Nombre del Taller ]';
    document.getElementById('taller-nombre').textContent = nombre;
    const tn2 = document.getElementById('taller-nombre2'); if (tn2) tn2.textContent = nombre;
    document.getElementById('taller-propietario').textContent = info['propietario'] || '—';
    document.getElementById('taller-telefono').textContent = info['telefono'] || '—';
    window._tallerTelefono = (info['telefono']||'').replace(/\D/g,'');
    const waLabel = document.getElementById('wa-num-label');
    if (waLabel && info['telefono']) waLabel.textContent = info['telefono'];
    document.getElementById('footer-brand').textContent = 'Taller ' + nombre;
    document.title = `Portafolio — ${nombre}`;

    if (window._tallerTelefono) {
      const msgB = encodeURIComponent('Hola, vi tu portafolio y me interesa contactarme contigo.');
      const waH = 'https://wa.me/'+window._tallerTelefono+'?text='+msgB;
      const fw = document.getElementById('footer-wa-btn'); if (fw) fw.href = waH;
      const fab = document.getElementById('wa-fab'); if (fab) fab.href = waH;
    }

    const groups = groupWorks(rows);
    const container = document.getElementById('works-container');
    if (groups.length === 0) {
      container.innerHTML = '<p style="color:var(--muted);font-size:13px;padding:1rem 0">No se encontraron trabajos.</p>';
    } else {
      container.innerHTML = groups.map((g, i) => renderWork(g, i+1)).join('');
      initCarousels(groups);
    }
    initLightbox();
    renderCategories(groups);
    handleHashNavigation(groups);
    hideLoader();
  } catch (err) {
    showError(`❌ <strong>No se pudo cargar la hoja.</strong> Verifica que esté publicada como CSV.<br><small>${escH(err.message)}</small>`);
  }
}

function handleHashNavigation(groups) {
  const hash = decodeURIComponent(window.location.hash);
  const m = hash.match(/^#proyecto-(.+?)(?:-foto-(\d+))?$/);
  if (!m) return;
  const clave = m[1]; const fotoIdx = m[2] ? parseInt(m[2])-1 : 0;
  const group = groups.find(g => g.clave === clave);
  if (!group || !group.slides.length) return;
  const idx = Math.min(fotoIdx, group.slides.length-1);
  const el = document.getElementById('proyecto-'+encodeURIComponent(clave));
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  const cardNum = el ? el.dataset.cardnum : '';
  const isZ = (el?.dataset.clave||'').startsWith('0-');
  const projTitle = isZ ? '// N/A' : (cardNum ? `// PROYECTO-${String(cardNum).padStart(2,'0')}` : clave);
  setTimeout(() => openLightbox(group.slides, projTitle, idx, clave), 400);
}

function renderCategories(groups) {
  const allSlides = [];
  groups.forEach(g => g.slides.forEach((s, si) => {
    if (s.foto) allSlides.push({ ...s, _clave: g.clave, _slideIdx: si, _cardNum: groups.indexOf(g)+1 });
  }));
  const catMap = new Map();
  allSlides.forEach(s => {
    const cat = s.categoria || '—';
    if (!catMap.has(cat)) catMap.set(cat, []);
    catMap.get(cat).push(s);
  });

  const foldersEl = document.getElementById('cat-folders');
  const panelEl = document.getElementById('cat-panel');
  const panelTitle = document.getElementById('cat-panel-title');
  const photoGrid = document.getElementById('cat-photo-grid');
  const backBtn = document.getElementById('cat-panel-back');
  const overlay = document.getElementById('cat-overlay');

  foldersEl.innerHTML = [...catMap.entries()].map(([cat, slides]) => `
    <div class="cat-folder" data-cat="${escH(cat)}">
      <div class="cat-folder-cover"><img src="${escH(slides[0].foto)}" alt="${escH(cat)}" loading="lazy"></div>
      <div class="cat-folder-info">
        <div class="cat-folder-name">${escH(cat)}</div>
        <div class="cat-folder-count">${slides.length} foto${slides.length!==1?'s':''}</div>
      </div>
    </div>`).join('');

  foldersEl.addEventListener('click', e => {
    const folder = e.target.closest('.cat-folder'); if (!folder) return;
    const cat = folder.dataset.cat; const slides = catMap.get(cat)||[];
    panelTitle.textContent = cat;
    photoGrid.innerHTML = slides.map((s, i) => `
      <div class="cat-photo" data-cat-idx="${i}">
        <img src="${escH(s.foto)}" alt="${escH(s.titulo)}" loading="lazy">
        <div class="cat-photo-overlay">
          <div class="cat-photo-title">${escH(s.titulo)}</div>
          <div class="cat-photo-proj">${s._clave.startsWith('0-')?'// N/A':`// PROYECTO-${String(s._cardNum).padStart(2,'0')}`}</div>
        </div>
      </div>`).join('');
    photoGrid.querySelectorAll('.cat-photo').forEach(card => {
      card.addEventListener('click', () => {
        const catIdx = parseInt(card.dataset.catIdx);
        // NO cerrar el overlay — queda vivo detrás del lightbox
        const catTitle = `// CATEGORÍA: ${cat}`;
        openLightbox(slides, catTitle, catIdx, '', overlay);
      });
    });
    foldersEl.style.display='none'; panelEl.classList.add('open');
  });

  backBtn.addEventListener('click', () => { panelEl.classList.remove('open'); foldersEl.style.display=''; });

  document.getElementById('cat-open-btn').addEventListener('click', () => {
    overlay.classList.add('open'); document.body.style.overflow='hidden';
  });
  function closeCat() {
    overlay.classList.remove('open'); document.body.style.overflow='';
    panelEl.classList.remove('open'); foldersEl.style.display='';
  }
  document.getElementById('cat-overlay-close').addEventListener('click', closeCat);
  overlay.addEventListener('click', e => { if (e.target===overlay) closeCat(); });
}

loadData();
</script>
</body>
